name: Feature request
description: An idea to make Nivel more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation (app, setup, what goes wrong today).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Nivel to do?
